version: '3'

volumes:
  static:
  media:
  pg_data:

services:
  db:
    container_name: kittygram_db
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    container_name: kittygram_backend
    build: backend
    env_file: .env
    command: >
      bash -c "
      sleep 5 &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn --bind 0.0.0.0:9000 kittygram_backend.wsgi
      "
    depends_on:
      - kittygram_db
    volumes:
      - static:/static
      - media:/app/media

  frontend:
    container_name: kittygram_frontend
    env_file: .env
    build: frontend
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static

  gateway:
    container_name: kittygram_gateway
    build: nginx
    env_file: .env
    depends_on:
      - kittygram_frontend
      - kittygram_backend
    ports:
      - 9000:80
    volumes:
      - static:/static
      - media:/app/media
